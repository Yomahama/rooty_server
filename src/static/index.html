<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooty Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    #status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 12px;
      padding: 16px 20px;
      transition: border-color 0.3s;
    }

    .stat-card.alert-low {
      border-color: #ef4444;
    }

    .stat-card.alert-high {
      border-color: #f97316;
    }

    .alert-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .alert-badge.low {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
    }

    .alert-badge.high {
      background: rgba(249,115,22,0.15);
      color: #f97316;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .stat-unit {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-left: 2px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .time-filters {
      display: flex;
      gap: 6px;
    }

    .time-btn {
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 6px;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .time-btn:hover {
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .time-btn.active {
      border-color: #3b82f6;
      color: #3b82f6;
      background: rgba(59,130,246,0.08);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .chart-card {
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .chart-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .chart-wrap {
      position: relative;
      height: 200px;
    }

    .prediction-card {
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }

    .prediction-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .pred-stat {
      background: #0f1117;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .pred-stat-label {
      font-size: 0.7rem;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .pred-stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .battery-section {
      margin-bottom: 32px;
    }

    .battery-card {
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 12px;
      padding: 20px 24px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .battery-card:hover {
      border-color: #22c55e;
    }

    .battery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #battery-stat-card:hover {
      border-color: #22c55e;
    }

    .battery-bar-wrap {
      background: #0f1117;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
    }

    .battery-bar {
      height: 100%;
      border-radius: 6px;
      background: #22c55e;
      transition: width 0.4s, background 0.4s;
    }

    .battery-hint {
      font-size: 0.7rem;
      color: #4b5563;
      margin-top: 8px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 16px;
      padding: 28px;
      width: 90%;
      max-width: 800px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #f8fafc;
    }

    .modal-chart-wrap {
      position: relative;
      height: 280px;
    }

    .plants-section {
      margin-bottom: 32px;
    }

    .plants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .plant-card {
      background: #1e2330;
      border: 2px solid #2d3448;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .plant-card:hover {
      border-color: #3b82f6;
      background: #1a2540;
    }

    .plant-card.active {
      border-color: #22c55e;
      background: #132a1e;
    }

    .plant-card.active .plant-assign-btn {
      background: #15803d;
      color: #bbf7d0;
    }

    .plant-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .plant-name {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .plant-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: #22c55e20;
      color: #22c55e;
      display: none;
    }

    .plant-card.active .plant-badge {
      display: inline-block;
    }

    .plant-ranges {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .plant-range {
      background: #0f1117;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .plant-range-label {
      font-size: 0.65rem;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .plant-range-value {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .plant-dli {
      margin-bottom: 14px;
    }

    .dli-bar-wrap {
      background: #0f1117;
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      margin-top: 6px;
    }

    .dli-bar {
      height: 100%;
      border-radius: 6px;
      background: #facc15;
      transition: width 0.4s;
    }

    .dli-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .dli-label {
      font-size: 0.7rem;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dli-value {
      font-size: 0.8rem;
      font-weight: 600;
      color: #facc15;
    }

    .plant-assign-btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #1d3461;
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .plant-assign-btn:hover {
      background: #1e40af;
      color: #fff;
    }

    .plant-assign-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>

<header>
  <h1>🌱 InRooty Dashboard</h1>
  <div id="status">
    <div id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div class="section-label">Live readings</div>
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">Moisture</div>
    <div class="stat-value" id="val-moisture">—<span class="stat-unit">%</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Humidity</div>
    <div class="stat-value" id="val-humidity">—<span class="stat-unit">%</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Air Temp</div>
    <div class="stat-value" id="val-temperature">—<span class="stat-unit">°C</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Soil Temp</div>
    <div class="stat-value" id="val-soil_temp">—<span class="stat-unit">°C</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Light</div>
    <div class="stat-value" id="val-lux">—<span class="stat-unit">lx</span></div>
  </div>
  <div class="stat-card" id="battery-stat-card" onclick="openBatteryModal()" style="cursor:pointer">
    <div class="stat-label">Battery</div>
    <div class="stat-value" id="val-battery" style="margin-bottom:8px">—<span class="stat-unit">%</span></div>
    <div class="battery-bar-wrap">
      <div class="battery-bar" id="battery-bar" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="history-header">
  <div class="section-label" style="margin-bottom:0">History</div>
  <div class="time-filters">
    <button class="time-btn" data-hours="1">1h</button>
    <button class="time-btn" data-hours="6">6h</button>
    <button class="time-btn" data-hours="24">24h</button>
    <button class="time-btn active" data-hours="0">All</button>
  </div>
</div>
<div class="charts-grid">
  <div class="chart-card">
    <div class="chart-title">Moisture &amp; Humidity (%)</div>
    <div class="chart-wrap"><canvas id="chart-moisture"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">Temperature (°C)</div>
    <div class="chart-wrap"><canvas id="chart-temperature"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">Light (lux)</div>
    <div class="chart-wrap"><canvas id="chart-lux"></canvas></div>
  </div>
</div>

<div class="modal-overlay" id="battery-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Battery history (%)</span>
      <button class="modal-close" onclick="closeBatteryModal()">&#x2715;</button>
    </div>
    <div class="modal-chart-wrap"><canvas id="chart-battery"></canvas></div>
  </div>
</div>

<div class="section-label">Watering prediction</div>
<div class="prediction-card" id="prediction-card">
  <div class="prediction-meta" id="prediction-meta">
    <div class="pred-stat">
      <div class="pred-stat-label">Current moisture</div>
      <div class="pred-stat-value" id="pred-moisture">—</div>
    </div>
    <div class="pred-stat">
      <div class="pred-stat-label">Water in</div>
      <div class="pred-stat-value" id="pred-hours">—</div>
    </div>
    <div class="pred-stat">
      <div class="pred-stat-label">Predicted at</div>
      <div class="pred-stat-value" id="pred-time">—</div>
    </div>
    <div class="pred-stat">
      <div class="pred-stat-label">Confidence</div>
      <div class="pred-stat-value" id="pred-confidence">—</div>
    </div>
  </div>
  <div class="chart-wrap" style="height:240px"><canvas id="chart-prediction"></canvas></div>
</div>

<div class="plants-section">
  <div class="section-label">Plants</div>
  <div class="plants-grid" id="plants-grid"></div>
</div>

<script>
  const API_BASE = window.location.origin;
  const POLL_MS = 3000;
  const HISTORY_LIMIT = 100;

  const chartDefaults = {
    type: "line",
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#94a3b8", boxWidth: 12, font: { size: 12 } } } },
      scales: {
        x: {
          ticks: { color: "#4b5563", maxTicksLimit: 8, maxRotation: 0, font: { size: 11 } },
          grid: { color: "#1f2937" },
        },
        y: {
          ticks: { color: "#4b5563", font: { size: 11 } },
          grid: { color: "#1f2937" },
        },
      },
    },
  };

  function makeChart(id, datasets) {
    return new Chart(document.getElementById(id), {
      ...chartDefaults,
      data: { labels: [], datasets },
    });
  }

  const predictionChart = new Chart(document.getElementById("chart-prediction"), {
    type: "line",
    data: { labels: [], datasets: [
      { label: "Historical", data: [], borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,0.08)", tension: 0.3, pointRadius: 2, fill: true },
      { label: "Predicted", data: [], borderColor: "#f97316", backgroundColor: "rgba(249,115,22,0.06)", borderDash: [6, 3], tension: 0.3, pointRadius: 2, fill: true },
    ]},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: "#94a3b8", boxWidth: 12, font: { size: 12 } } },
        annotation: {},
      },
      scales: {
        x: { ticks: { color: "#4b5563", maxTicksLimit: 10, maxRotation: 0, font: { size: 11 } }, grid: { color: "#1f2937" } },
        y: { ticks: { color: "#4b5563", font: { size: 11 } }, grid: { color: "#1f2937" } },
      },
    },
  });

  const confidenceColors = { high: "#22c55e", medium: "#facc15", low: "#f97316" };

  function applyPrediction(p) {
    const histLabels = p.historical.map(pt => fmt(pt.timestamp));
    const predLabels = p.predicted.map(pt => fmt(pt.timestamp));
    const allLabels = [...histLabels, ...predLabels.filter(l => !histLabels.includes(l))];

    const histData = allLabels.map(l => {
      const idx = histLabels.indexOf(l);
      return idx >= 0 ? p.historical[idx].value : null;
    });
    const predData = allLabels.map(l => {
      const idx = predLabels.indexOf(l);
      return idx >= 0 ? p.predicted[idx].value : null;
    });

    predictionChart.data.labels = allLabels;
    predictionChart.data.datasets[0].data = histData;
    predictionChart.data.datasets[1].data = predData;
    predictionChart.update();

    document.getElementById("pred-moisture").textContent =
      p.current_moisture != null ? p.current_moisture + "%" : "—";
    document.getElementById("pred-hours").textContent =
      p.hours_until_watering != null ? p.hours_until_watering + "h" : "—";
    document.getElementById("pred-time").textContent =
      p.predicted_watering_time ? fmt(p.predicted_watering_time) : "—";

    const confEl = document.getElementById("pred-confidence");
    confEl.textContent = p.confidence || "—";
    confEl.style.color = p.confidence ? (confidenceColors[p.confidence] || "#f8fafc") : "#f8fafc";
  }

  let activePlantRanges = null;

  const charts = {
    moisture: makeChart("chart-moisture", [
      { label: "Moisture", data: [], borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,0.08)", tension: 0.3, pointRadius: 2, fill: true },
      { label: "Humidity", data: [], borderColor: "#a78bfa", backgroundColor: "rgba(167,139,250,0.08)", tension: 0.3, pointRadius: 2, fill: true },
    ]),
    temperature: makeChart("chart-temperature", [
      { label: "Air", data: [], borderColor: "#f97316", backgroundColor: "rgba(249,115,22,0.08)", tension: 0.3, pointRadius: 2, fill: true },
      { label: "Soil", data: [], borderColor: "#fbbf24", backgroundColor: "rgba(251,191,36,0.08)", tension: 0.3, pointRadius: 2, fill: true },
    ]),
    lux: makeChart("chart-lux", [
      { label: "Lux", data: [], borderColor: "#facc15", backgroundColor: "rgba(250,204,21,0.08)", tension: 0.3, pointRadius: 2, fill: true },
    ]),
    battery: makeChart("chart-battery", [
      { label: "Battery", data: [], borderColor: "#22c55e", backgroundColor: "rgba(34,197,94,0.08)", tension: 0.3, pointRadius: 2, fill: true },
    ]),
  };

  function applyMoistureAnnotations() {
    const chart = charts.moisture;
    const datasets = chart.data.datasets;

    const existingMin = datasets.findIndex(d => d._isMoistureMin);
    const existingMax = datasets.findIndex(d => d._isMoistureMax);
    if (existingMin >= 0) datasets.splice(existingMin, 1);
    const maxIdx = datasets.findIndex(d => d._isMoistureMax);
    if (maxIdx >= 0) datasets.splice(maxIdx, 1);

    if (!activePlantRanges || !chart.data.labels.length) {
      chart.update();
      return;
    }

    const count = chart.data.labels.length;
    const minLine = Array(count).fill(activePlantRanges.moisture_min);
    const maxLine = Array(count).fill(activePlantRanges.moisture_max);

    datasets.push({
      label: "Min threshold",
      data: minLine,
      borderColor: "rgba(239,68,68,0.5)",
      borderDash: [4, 4],
      borderWidth: 1,
      pointRadius: 0,
      fill: false,
      tension: 0,
      _isMoistureMin: true,
    });
    datasets.push({
      label: "Max threshold",
      data: maxLine,
      borderColor: "rgba(249,115,22,0.5)",
      borderDash: [4, 4],
      borderWidth: 1,
      pointRadius: 0,
      fill: false,
      tension: 0,
      _isMoistureMax: true,
    });

    chart.update();
  }

  function openBatteryModal() {
    document.getElementById("battery-modal").classList.add("open");
    charts.battery.resize();
  }

  function closeBatteryModal() {
    document.getElementById("battery-modal").classList.remove("open");
  }

  document.getElementById("battery-modal").addEventListener("click", function(e) {
    if (e.target === this) closeBatteryModal();
  });

  let currentHoursFilter = 0;

  function fmt(ts, forceDate) {
    const d = new Date(ts);
    if (forceDate || currentHoursFilter > 6) {
      return d.toLocaleDateString([], { month: "2-digit", day: "2-digit" }) + " " +
        d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function setVal(id, value) {
    const el = document.getElementById("val-" + id);
    const unit = el.querySelector(".stat-unit");
    el.childNodes[0].textContent = value != null ? value : "—";
    if (unit) el.appendChild(unit);
  }

  function applyHistory(rows) {
    const labels = rows.map(r => fmt(r.timestamp));

    charts.moisture.data.labels = labels;
    charts.moisture.data.datasets[0].data = rows.map(r => r.moisture);
    charts.moisture.data.datasets[1].data = rows.map(r => r.humidity);

    charts.temperature.data.labels = labels;
    charts.temperature.data.datasets[0].data = rows.map(r => r.temperature);
    charts.temperature.data.datasets[1].data = rows.map(r => r.soil_temp);

    charts.lux.data.labels = labels;
    charts.lux.data.datasets[0].data = rows.map(r => r.lux);

    charts.battery.data.labels = labels;
    charts.battery.data.datasets[0].data = rows.map(r => r.battery);

    [charts.temperature, charts.lux, charts.battery].forEach(c => c.update());
    applyMoistureAnnotations();

    const lastBattery = rows.length ? rows[rows.length - 1].battery : null;
    updateBatteryBar(lastBattery);
  }

  function applyLatest(d) {
    setVal("moisture", d.moisture);
    setVal("humidity", d.humidity != null ? d.humidity.toFixed(1) : null);
    setVal("temperature", d.temperature != null ? d.temperature.toFixed(1) : null);
    setVal("soil_temp", d.soil_temp != null ? d.soil_temp.toFixed(1) : null);
    setVal("lux", d.lux != null ? Math.round(d.lux) : null);
    setVal("battery", d.battery);
    updateBatteryBar(d.battery);
    updateMoistureAlert(d.moisture);

    const ts = new Date(d.timestamp).toLocaleTimeString();
    document.getElementById("status-text").textContent = "Updated " + ts;
  }

  function updateMoistureAlert(moisture) {
    const card = document.getElementById("val-moisture").closest(".stat-card");
    let badge = card.querySelector(".alert-badge");

    card.classList.remove("alert-low", "alert-high");
    if (badge) badge.remove();

    if (moisture == null || !activePlantRanges) return;

    if (moisture < activePlantRanges.moisture_min) {
      card.classList.add("alert-low");
      badge = document.createElement("div");
      badge.className = "alert-badge low";
      badge.textContent = "Too dry";
      card.appendChild(badge);
    } else if (moisture > activePlantRanges.moisture_max) {
      card.classList.add("alert-high");
      badge = document.createElement("div");
      badge.className = "alert-badge high";
      badge.textContent = "Too wet";
      card.appendChild(badge);
    }
  }

  let activePlantId = null;


  async function assignPlant(plantId, btn) {
    btn.disabled = true;
    try {
      await fetch(`${API_BASE}/api/device/assign-plant`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ plant_id: plantId }),
      });
      activePlantId = plantId;
      renderPlantCards(window._plants, window._dliMap);
    } finally {
      btn.disabled = false;
    }
  }

  function renderPlantCards(plants, dliMap) {
    const grid = document.getElementById("plants-grid");
    grid.innerHTML = "";

    plants.forEach(p => {
      const isActive = p.id === activePlantId;
      const dli = dliMap[p.id];
      const dliPct = dli ? Math.min(100, Math.round(dli.percent)) : null;

      const card = document.createElement("div");
      card.className = "plant-card" + (isActive ? " active" : "");

      card.innerHTML = `
        <div class="plant-header">
          <div class="plant-name">${p.name}</div>
          <div class="plant-badge">Active</div>
        </div>
        <div class="plant-ranges">
          <div class="plant-range">
            <div class="plant-range-label">Moisture</div>
            <div class="plant-range-value">${p.moisture_min}–${p.moisture_max}%</div>
          </div>
          <div class="plant-range">
            <div class="plant-range-label">Temperature</div>
            <div class="plant-range-value">${p.temp_min}–${p.temp_max}°C</div>
          </div>
          <div class="plant-range">
            <div class="plant-range-label">DLI target</div>
            <div class="plant-range-value">${p.dli_min}–${p.dli_max} mol</div>
          </div>
        </div>
        ${dliPct !== null ? `
        <div class="plant-dli">
          <div class="dli-label-row">
            <span class="dli-label">Today's DLI</span>
            <span class="dli-value">${dli.current_dli.toFixed(2)} / ${dli.target_dli.toFixed(1)} mol (${dliPct}%)</span>
          </div>
          <div class="dli-bar-wrap"><div class="dli-bar" style="width:${dliPct}%"></div></div>
        </div>` : ""}
        <button class="plant-assign-btn"${isActive ? " disabled" : ""}>${isActive ? "Currently active" : "Set as active"}</button>
      `;

      const btn = card.querySelector(".plant-assign-btn");
      if (!isActive) {
        btn.addEventListener("click", () => assignPlant(p.id, btn));
      }

      grid.appendChild(card);
    });
  }

  async function loadPlants() {
    try {
      const [plants, currentPlant] = await Promise.all([
        fetch(`${API_BASE}/api/plants`).then(r => r.json()),
        fetch(`${API_BASE}/api/device/current-plant`).then(r => r.ok ? r.json() : null),
      ]);

      window._plants = plants;
      activePlantId = currentPlant ? currentPlant.id : null;
      activePlantRanges = currentPlant || null;
      applyMoistureAnnotations();

      const dliResults = await Promise.all(
        plants.map(p =>
          fetch(`${API_BASE}/api/dli/${p.id}`).then(r => r.ok ? r.json() : null)
        )
      );

      const dliMap = {};
      plants.forEach((p, i) => { if (dliResults[i]) dliMap[p.id] = dliResults[i]; });
      window._dliMap = dliMap;

      renderPlantCards(plants, dliMap);
    } catch {
    }
  }

  function buildHistoryUrl() {
    if (currentHoursFilter === 0) {
      return `${API_BASE}/api/history?limit=${HISTORY_LIMIT}`;
    }
    const to = new Date();
    const from = new Date(to.getTime() - currentHoursFilter * 60 * 60 * 1000);
    return `${API_BASE}/api/history?from_time=${from.toISOString()}&to_time=${to.toISOString()}`;
  }

  async function refresh() {
    try {
      const [history, latest, prediction] = await Promise.all([
        fetch(buildHistoryUrl()).then(r => r.json()),
        fetch(`${API_BASE}/api/latest`).then(r => r.ok ? r.json() : null),
        fetch(`${API_BASE}/api/prediction`).then(r => r.ok ? r.json() : null),
      ]);
      const reversed = [...history].reverse();
      applyHistory(reversed);
      if (latest) {
        applyLatest(latest);
      } else if (reversed.length) {
        applyLatest(reversed[reversed.length - 1]);
      }
      if (prediction) {
        applyPrediction(prediction);
      }
      document.getElementById("status-dot").style.background = "#22c55e";
    } catch {
      document.getElementById("status-dot").style.background = "#ef4444";
      document.getElementById("status-text").textContent = "Connection error";
    }
  }

  function updateBatteryBar(value) {
    const bar = document.getElementById("battery-bar");
    const valEl = document.getElementById("val-battery");
    if (value == null) return;
    const pct = Math.min(100, Math.max(0, value));
    bar.style.width = pct + "%";
    let color;
    if (pct > 50) {
      color = "#22c55e";
    } else if (pct > 20) {
      color = "#facc15";
    } else {
      color = "#ef4444";
    }
    bar.style.background = color;
    valEl.style.color = color;
  }

  document.querySelectorAll(".time-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentHoursFilter = parseInt(btn.dataset.hours);
      refresh();
    });
  });

  loadPlants();
  refresh();
  setInterval(refresh, POLL_MS);
  setInterval(loadPlants, 30000);
</script>
</body>
</html>
