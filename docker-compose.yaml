version: "3.8"

services:
  fastapi:
    build: .
    container_name: rooty_fastapi
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    networks:
      - rooty_network

networks:
  rooty_network:
    driver: bridge
